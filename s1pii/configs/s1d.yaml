attention_implementation: flex_attention
lora_rank: 32
state_tokens: 512
max_branches: 64
max_options: 56
training:
  # Preserve the preregistered optimizer-batch schedule; equal-length rows within each batch
  # share a real A100 backbone call.
  token_budget: 8192
stage1_pilot:
  data_seed: 1
  init_seeds: [1, 2]
  order_seed: 1
  windows: 16000
  # All conditions consume the complete, identical 16k selection. Forty-eight original
  # token-budget microbatches is about 600 questions and is divisible by acc8.
  sanity_every_microbatches: 48
  checkpoint_every_updates: 25
  probe_questions: 32
  warmup_fraction: 0.06
  gradient_clip: 1.0
  lora_learning_rate: 0.0002
  pointer_learning_rate: 0.00005
  token_learning_rate: 0.0002
  collapse:
    gold_accuracy_below: 0.5
    not_pii_rate_above: 0.3
    single_option_rate_above: 0.6
stages:
  stage0:
    cap_a100_hours: 5
    enforce_cap: false
    unit_estimates:
      proposer_all: 1.2
      proposer_no_nemotron: 1.2
      prompted_probe: 0.7
      kev_baseline: 0.4
