[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "s1pii"
version = "0.1.0"
description = "S1-PII: a System One span-level PII detector and a leakage-audited benchmark"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = ["numpy>=1.26", "pyyaml>=6", "scikit-learn>=1.3", "datasketch>=1.6", "pandas>=2", "pyarrow>=14"]

[project.optional-dependencies]
data = ["datasets>=3.0", "huggingface_hub>=0.24"]
model = ["torch>=2.3", "transformers>=4.48", "accelerate>=0.33", "phonenumbers>=8.13"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["s1pii*"]

[tool.setuptools.package-data]
s1pii = ["data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
